name: Release

# Pushing a v* tag (on a commit on main) builds the distributable zip,
# installs it in wp-env on the oldest and the latest supported stack, runs
# wordpress.org's Plugin Check on it, and drafts a GitHub Release with the
# zip and SHA256SUMS. Publishing the draft
# is a person's step; so is wordpress.org (README.md, "Releasing").
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs nothing from npm: the zip is built and uploaded from the pristine
  # checkout, so no dependency's install script or build code can touch
  # bin/build-zip.sh, .git or the sources it archives.
  build:
    name: Build the zip
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.zip.outputs.version }}
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag names a release version and a commit on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$GITHUB_REF_NAME is not a release tag (v1.2.3)"; exit 1; }
          # fetch-depth 0 fetched every branch: origin/main is here.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: The plugin header Version and readme.txt Stable tag match the tag
        run: bin/build-zip.sh --ref "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" --check
      - name: Build the zip
        id: zip
        run: bin/build-zip.sh --ref "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" --out dist
      - name: The build is reproducible
        run: |
          bin/build-zip.sh --ref "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/again" > /dev/null
          cmp dist/SHA256SUMS "$RUNNER_TEMP/again/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # The zip ships the committed builds, so they must be what the sources
  # build. Its own job: npm's code never runs where the zip is made.
  assets:
    name: Built assets match their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: npm run build changes nothing
        run: npm run build && git diff --exit-code -- assets/ && test -z "$(git status --porcelain -- assets/)"

  verify:
    name: Zip installs (WP ${{ matrix.wp }}, WC ${{ matrix.wc }}, PHP ${{ matrix.php }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { wp: "6.7", core: "https://wordpress.org/wordpress-6.7.zip", wc: "9.9.0", php: "7.4" }
          - { wp: "latest", core: "", wc: "11.3.0", php: "8.3" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Checksum
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Install, activate and uninstall in wp-env
        env:
          CORE: ${{ matrix.core }}
          WC: ${{ matrix.wc }}
          PHP: ${{ matrix.php }}
        run: bin/verify-zip.sh dist/navexa-agecheck-for-woocommerce-*.zip --core "$CORE" --wc "$WC" --php "$PHP"

  # wordpress.org's Plugin Check on the zip, in a throwaway wp-env: any ERROR
  # fails the release (warnings are printed). Plugin Check is the version
  # wordpress.org serves that day.
  plugin-check:
    name: Plugin Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Checksum
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Plugin Check finds no errors
        run: bin/plugin-check.sh dist/navexa-agecheck-for-woocommerce-*.zip

  release:
    name: Draft the GitHub Release
    needs: [build, assets, verify, plugin-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Checksum, and the zip is the one the build job hashed
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          cd dist && sha256sum -c SHA256SUMS
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the build job reported no SHA-256"; exit 1; }
          echo "$SHA256  navexa-agecheck-for-woocommerce-$VERSION.zip" | sha256sum -c -
      - name: Draft the release with the zip and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          zip="dist/navexa-agecheck-for-woocommerce-$VERSION.zip"
          test -f "$zip"
          printf '%s\n' \
            "Navexa AgeCheck for WooCommerce $VERSION, built from $GITHUB_SHA by the Release workflow." \
            "" \
            "Install: WordPress admin > Plugins > Add New > Upload Plugin, then the zip." \
            "" \
            "SHA-256: \`$SHA256\` (also in SHA256SUMS: \`sha256sum -c SHA256SUMS\`)." \
            "" \
            "Changes: the Changelog section of readme.txt." > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$zip" dist/SHA256SUMS \
            --draft --verify-tag \
            --title "Navexa AgeCheck for WooCommerce $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
